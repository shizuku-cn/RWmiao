plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}
def envOrProperty = { String environmentName, String propertyName ->
    def environmentValue = System.getenv(environmentName)
    environmentValue?.trim() ?: releaseSigningProperties.getProperty(propertyName)?.trim()
}
def releaseStoreFile = envOrProperty('RWMIAO_RELEASE_STORE_FILE', 'storeFile')
def releaseStorePassword = envOrProperty('RWMIAO_RELEASE_STORE_PASSWORD', 'storePassword')
def releaseKeyAlias = envOrProperty('RWMIAO_RELEASE_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = envOrProperty('RWMIAO_RELEASE_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it }

android {
    namespace 'com.shizuku.rwmiao'
    compileSdk 35
    buildToolsVersion '36.0.0'

    buildFeatures {
        buildConfig true
        compose true
    }

    defaultConfig {
        applicationId 'com.shizuku.rwmiao'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName 'v1.1'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            merges += ['META-INF/xposed/*']
            merges += ['Config/Scripts/*.lua']
            merges += ['Config/Scripts/.keep']
        }
    }

    sourceSets {
        main.resources.srcDir layout.buildDirectory.dir('generated/configResources')
    }
}

def syncConfigScripts = tasks.register('syncConfigScripts', Sync) {
    from("${rootDir}/config/Scripts") { include '**/*.lua'; include '.keep' }
    into(layout.buildDirectory.dir('generated/configResources/Config/Scripts'))
}

tasks.configureEach { task ->
    if (task.name.startsWith('process') && task.name.endsWith('JavaRes')) {
        task.dependsOn(syncConfigScripts)
    }
}

dependencies {
    compileOnly files('libs/api-102.0.0.aar')
    implementation files('libs/colorpicker-0.0.15.aar')
    implementation 'org.luaj:luaj-jse:3.0.1'
    implementation platform('androidx.compose:compose-bom:2025.08.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.9.3'
    implementation 'androidx.savedstate:savedstate:1.3.1'
    testImplementation 'junit:junit:4.13.2'
}
