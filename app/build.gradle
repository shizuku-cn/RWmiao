plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.shizuku.rwmiao'
    compileSdk 35
    buildToolsVersion '36.0.0'

    buildFeatures {
        buildConfig true
        compose true
    }

    defaultConfig {
        applicationId 'com.shizuku.rwmiao'
        minSdk 26
        targetSdk 35
        // Native formation-strip implementation: extra slots use the game's
        // own renderer and input path instead of an Android overlay.
        versionCode 1
        versionName '0.12-b1'
    }

    signingConfigs {
        debug {
            storeFile file('../config/signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            merges += ['META-INF/xposed/*']
            merges += ['Config/Scripts/*.lua']
            merges += ['Config/Scripts/.keep']
        }
    }

    sourceSets {
        main.resources.srcDir layout.buildDirectory.dir('generated/configResources')
    }
}

def syncConfigScripts = tasks.register('syncConfigScripts', Sync) {
    from("${rootDir}/Config/Scripts") { include '**/*.lua'; include '.keep' }
    into(layout.buildDirectory.dir('generated/configResources/Config/Scripts'))
}

tasks.configureEach { task ->
    if (task.name.startsWith('process') && task.name.endsWith('JavaRes')) {
        task.dependsOn(syncConfigScripts)
    }
}

dependencies {
    compileOnly files('../../build-tools-cache/api-102.0.0.aar')
    implementation files('libs/colorpicker-0.0.15.aar')
    implementation 'org.luaj:luaj-jse:3.0.1'
    implementation platform('androidx.compose:compose-bom:2025.08.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.9.3'
    implementation 'androidx.savedstate:savedstate:1.3.1'
}


